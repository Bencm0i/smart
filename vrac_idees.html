<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vrac</title>
<style>
  :root{
    --bg: #141414;
    --panel: #1c1c1c;
    --panel-2: #232323;
    --ink: #eae6dd;
    --ink-dim: #8a8a85;
    --rule: #333330;
    --amber: #e8a33d;
    --green: #7fae6a;
    --red: #c1614f;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex;
    justify-content:center;
    padding: 32px 16px 80px;
  }
  .mono{ font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; }

  .app{ width:100%; max-width:640px; }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
  }
  header h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
    margin:0;
  }
  header .count{
    font-size:12px;
    color:var(--ink-dim);
  }

  /* Reminder gauge */
  .gauge{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:24px;
  }
  .dot{
    width:10px; height:10px; border-radius:50%;
    flex-shrink:0;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(127,174,106,0.15);
  }
  .dot.warn{ background:var(--amber); box-shadow:0 0 0 4px rgba(232,163,61,0.15); }
  .dot.late{ background:var(--red); box-shadow:0 0 0 4px rgba(193,97,79,0.15); }
  .gauge-text{ flex:1; font-size:13px; line-height:1.4; }
  .gauge-text b{ color:var(--ink); }
  .gauge-text span{ color:var(--ink-dim); }
  .gauge button{
    background:none;
    border:1px solid var(--rule);
    color:var(--ink-dim);
    font-size:11px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .gauge button:hover{ border-color:var(--amber); color:var(--amber); }

  /* Capture box */
  .capture{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:12px;
    margin-bottom:28px;
  }
  textarea{
    width:100%;
    min-height:64px;
    resize:vertical;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-size:15px;
    line-height:1.5;
    font-family:inherit;
  }
  textarea::placeholder{ color:var(--ink-dim); }
  .capture-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    border-top:1px solid var(--rule);
    padding-top:10px;
  }
  .hint{ font-size:11px; color:var(--ink-dim); }
  .add-btn{
    background:var(--amber);
    color:#1a1200;
    border:none;
    font-weight:700;
    font-size:13px;
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
  }
  .add-btn:hover{ filter:brightness(1.08); }

  /* Entries */
  .entries{ display:flex; flex-direction:column; gap:1px; }
  .entry{
    background:var(--panel);
    border:1px solid var(--rule);
    border-top:none;
    padding:12px 14px;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .entries .entry:first-child{ border-top:1px solid var(--rule); border-radius:8px 8px 0 0; }
  .entries .entry:last-child{ border-radius:0 0 8px 8px; }
  .entries .entry:only-child{ border-radius:8px; }
  .entry .ts{
    font-size:11px;
    color:var(--amber);
    white-space:nowrap;
    padding-top:2px;
    flex-shrink:0;
  }
  .entry .txt{
    flex:1;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .entry .del{
    background:none;
    border:none;
    color:var(--ink-dim);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:0 2px;
    flex-shrink:0;
  }
  .entry .del:hover{ color:var(--red); }

  .empty{
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
    padding:40px 0;
    border:1px dashed var(--rule);
    border-radius:10px;
  }

  /* Bottom actions */
  .actions{
    display:flex;
    gap:8px;
    margin-top:24px;
    flex-wrap:wrap;
  }
  .actions button{
    flex:1;
    min-width:120px;
    background:var(--panel-2);
    border:1px solid var(--rule);
    color:var(--ink);
    font-size:12px;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
  }
  .actions button:hover{ border-color:var(--ink-dim); }
  input[type=file]{ display:none; }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);
    border:1px solid var(--rule);
    color:var(--ink);
    font-size:12px;
    padding:10px 16px;
    border-radius:8px;
    opacity:0;
    transition:opacity 0.2s, transform 0.2s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Vrac</h1>
    <div class="count mono" id="count">0 note</div>
  </header>

  <div class="gauge">
    <div class="dot" id="gaugeDot"></div>
    <div class="gauge-text">
      <b id="gaugeMain">Aucun tri enregistré</b><br>
      <span id="gaugeSub">Importe un fichier existant ou commence à noter.</span>
    </div>
    <button id="markSorted">Marquer trié</button>
  </div>

  <div class="capture">
    <textarea id="input" placeholder="Note ce qui te passe par la tête… idée, todo, hypothèse, peu importe."></textarea>
    <div class="capture-footer">
      <span class="hint">Ctrl/Cmd + Entrée pour ajouter</span>
      <button class="add-btn" id="addBtn">Ajouter</button>
    </div>
  </div>

  <div class="entries" id="entries"></div>
  <div class="empty" id="emptyState">Rien pour l'instant. Ta première note atterrit ici.</div>

  <div class="actions">
    <button id="copyAll">Copier tout (pour l'IA)</button>
    <button id="exportBtn">Exporter (.json)</button>
    <button id="importBtn">Importer (.json)</button>
    <input type="file" id="fileInput" accept="application/json">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'vrac_data_v1';

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { entries: [], lastSorted: null };
      const data = JSON.parse(raw);
      return {
        entries: Array.isArray(data.entries) ? data.entries : [],
        lastSorted: data.lastSorted || null
      };
    } catch(e){
      return { entries: [], lastSorted: null };
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e){
      showToast('Stockage local indisponible');
    }
  }

  let state = loadState();

  const els = {
    input: document.getElementById('input'),
    addBtn: document.getElementById('addBtn'),
    entries: document.getElementById('entries'),
    empty: document.getElementById('emptyState'),
    count: document.getElementById('count'),
    gaugeDot: document.getElementById('gaugeDot'),
    gaugeMain: document.getElementById('gaugeMain'),
    gaugeSub: document.getElementById('gaugeSub'),
    markSorted: document.getElementById('markSorted'),
    copyAll: document.getElementById('copyAll'),
    exportBtn: document.getElementById('exportBtn'),
    importBtn: document.getElementById('importBtn'),
    fileInput: document.getElementById('fileInput'),
    toast: document.getElementById('toast'),
  };

  function fmtTs(iso){
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function daysBetween(a,b){
    return Math.floor((b - a) / (1000*60*60*24));
  }

  function render(){
    // entries list, newest first
    els.entries.innerHTML = '';
    const sorted = [...state.entries].sort((a,b)=> new Date(b.ts) - new Date(a.ts));
    if(sorted.length === 0){
      els.empty.style.display = 'block';
    } else {
      els.empty.style.display = 'none';
      sorted.forEach(e=>{
        const row = document.createElement('div');
        row.className = 'entry';
        row.innerHTML = `
          <div class="ts mono">${fmtTs(e.ts)}</div>
          <div class="txt"></div>
          <button class="del" title="Supprimer">×</button>
        `;
        row.querySelector('.txt').textContent = e.text;
        row.querySelector('.del').addEventListener('click', ()=>{
          state.entries = state.entries.filter(x => x !== e);
          saveState();
          render();
        });
        els.entries.appendChild(row);
      });
    }
    els.count.textContent = state.entries.length + (state.entries.length > 1 ? ' notes' : ' note');
    renderGauge();
  }

  function renderGauge(){
    const now = new Date();
    if(!state.lastSorted){
      els.gaugeDot.className = 'dot';
      els.gaugeMain.textContent = state.entries.length > 0
        ? `${state.entries.length} note(s) jamais triée(s)`
        : 'Aucun tri enregistré';
      els.gaugeSub.textContent = 'Colle "Copier tout" dans une conversation IA pour trier, puis marque comme trié.';
      return;
    }
    const days = daysBetween(new Date(state.lastSorted), now);
    let level = 'dot';
    if(days >= 14) level = 'dot late';
    else if(days >= 7) level = 'dot warn';
    els.gaugeDot.className = level;
    els.gaugeMain.textContent = days === 0 ? 'Trié aujourd\'hui' : `${days} jour${days>1?'s':''} depuis le dernier tri`;
    els.gaugeSub.textContent = days >= 14
      ? 'Ça commence à s\'accumuler — un passage IA serait utile.'
      : days >= 7
      ? 'Un tri cette semaine ne ferait pas de mal.'
      : 'Tranquille.';
  }

  function addEntry(){
    const text = els.input.value.trim();
    if(!text) return;
    state.entries.push({ ts: new Date().toISOString(), text });
    els.input.value = '';
    saveState();
    render();
  }

  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    setTimeout(()=> els.toast.classList.remove('show'), 1800);
  }

  els.addBtn.addEventListener('click', addEntry);
  els.input.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      addEntry();
    }
  });

  els.markSorted.addEventListener('click', ()=>{
    state.lastSorted = new Date().toISOString();
    saveState();
    renderGauge();
    showToast('Marqué comme trié');
  });

  els.copyAll.addEventListener('click', ()=>{
    if(state.entries.length === 0){ showToast('Rien à copier'); return; }
    const sorted = [...state.entries].sort((a,b)=> new Date(a.ts) - new Date(b.ts));
    const text = sorted.map(e => `${fmtTs(e.ts)} — ${e.text}`).join('\n');
    navigator.clipboard.writeText(text).then(()=>{
      showToast('Copié — colle-le dans une conversation IA');
    }).catch(()=>{
      showToast('Copie impossible ici, sélectionne manuellement');
    });
  });

  els.exportBtn.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `vrac-${stamp}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Fichier exporté');
  });

  els.importBtn.addEventListener('click', ()=> els.fileInput.click());
  els.fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const data = JSON.parse(evt.target.result);
        if(!Array.isArray(data.entries)) throw new Error('format invalide');
        state = { entries: data.entries, lastSorted: data.lastSorted || null };
        saveState();
        render();
        showToast('Fichier importé');
      } catch(err){
        showToast('Fichier invalide');
      }
    };
    reader.readAsText(file);
    els.fileInput.value = '';
  });

  render();
})();
</script>
</body>
</html>
